spring:
  datasource:
    url: jdbc:mysql://mysql:3306/know_engine?rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
  data:
    redis:
      host: redis
      port: 6379
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          connectionMinimumIdleSize: 2
          connectionPoolSize: 16
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
elasticsearch:
  host: http://elasticsearch:9200
minio:
  url: http://minio:9000
  endpoint: http://127.0.0.1:19090
file:
  parse:
    api:
      url: ${MINERU_URL:http://host.docker.internal:8000}
