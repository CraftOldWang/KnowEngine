name: know-engine

services:
  backend:
    profiles: ["app"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: compose,container
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-NOT_CONFIGURED}
      MINERU_URL: ${MINERU_URL:-http://host.docker.internal:8000}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/application-local.yml
    volumes:
      - ./src/main/resources/model:/app/extra/model:ro
      - ./src/main/resources/application-local.yml:/app/config/application-local.yml:ro
      - eval-data:/tmp/know-engine-eval
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8009/api/document/page >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: know-engine-local
      MYSQL_DATABASE: know_engine
      MYSQL_USER: know_engine
      MYSQL_PASSWORD: know-engine-local
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D know_engine -e 'SELECT 1 FROM knowledge_document LIMIT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: knowengine
      MINIO_ROOT_PASSWORD: know-engine-local
    ports:
      - "127.0.0.1:19090:9000"
      - "127.0.0.1:19000:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  eval-data:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
